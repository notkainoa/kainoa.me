<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kainoa Newton</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Work+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Work Sans', 'sans-serif'],
              inter: ['Inter', 'sans-serif'],
              worksans: ['Work Sans', 'sans-serif'],
            },
            colors: {
              neutral: {
                850: '#1f1f1f',
                900: '#171717', // Specific requested background
                950: '#0a0a0a',
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #171717; /* neutral-900 */
        color: #e5e5e5; /* neutral-200 */
        font-family: 'Inter', sans-serif;
        font-size: 16px; /* Explicitly requested */
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #171717; 
      }
      ::-webkit-scrollbar-thumb {
        background: #404040; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #525252; 
      }
      @keyframes toast-enter {
        0% {
          opacity: 0;
          transform: translateY(16px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .toast-enter {
        animation: toast-enter 0.3s ease-out;
      }
      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-in {
        opacity: 0;
        animation: fade-up 0.6s ease-out forwards;
      }
      .project-card {
        opacity: 0;
        animation: fade-up 0.35s ease-out forwards;
      }
      /* Description morph (components/DescriptionMorph.tsx). Each word is absolutely
         positioned at its spot in the short text (--ax/--ay) and moves to its spot
         in the full text (--bx/--by) while the card is hovered or focused. */
      .morph {
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        position: relative;
        height: var(--h-short, auto);
        transition: height 300ms var(--ease-in-out);
      }
      .morph-measure {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        visibility: hidden;
        pointer-events: none;
      }
      .morph-tok {
        position: absolute;
        top: 0;
        left: 0;
        white-space: pre;
        /* Hidden full-text words sit below the collapsed card; without this,
           hovering that empty space would count as hovering the card. */
        pointer-events: none;
        transform: translate(var(--ax), var(--ay));
        transition:
          transform 300ms var(--ease-in-out),
          opacity 150ms var(--ease-out);
      }
      /* Words only in the short text (and the "..."): visible at rest. On the way
         back they return after the shared words have slid home. */
      .morph-short {
        opacity: 1;
        transition-delay: 0ms, 160ms;
      }
      /* Words only in the full text: hidden at rest, leave immediately. */
      .morph-full {
        opacity: 0;
        transition-delay: 0ms, 0ms;
      }
      .morph-text-full {
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
        transition: opacity 200ms var(--ease-out);
      }
      .morph-text-short {
        transition: opacity 200ms var(--ease-out);
      }
      /* Expanded state: hover on devices that can hover, plus keyboard focus. */
      .project-card:focus-visible .morph {
        height: var(--h-full, auto);
      }
      .project-card:focus-visible .morph-tok {
        transform: translate(var(--bx), var(--by));
      }
      .project-card:focus-visible .morph-short,
      .project-card:focus-visible .morph-text-short {
        opacity: 0;
        transition-delay: 0ms, 0ms;
      }
      .project-card:focus-visible .morph-full,
      .project-card:focus-visible .morph-text-full {
        opacity: 1;
      }
      .project-card:focus-visible .morph-full {
        transition-duration: 300ms, 220ms;
        transition-delay: 0ms, calc(180ms + var(--stagger, 0ms));
      }
      @media (hover: hover) and (pointer: fine) {
        .project-card:hover .morph {
          height: var(--h-full, auto);
        }
        .project-card:hover .morph-tok {
          transform: translate(var(--bx), var(--by));
        }
        .project-card:hover .morph-short,
        .project-card:hover .morph-text-short {
          opacity: 0;
          transition-delay: 0ms, 0ms;
        }
        .project-card:hover .morph-full,
        .project-card:hover .morph-text-full {
          opacity: 1;
        }
        .project-card:hover .morph-full {
          transition-duration: 300ms, 220ms;
          transition-delay: 0ms, calc(180ms + var(--stagger, 0ms));
        }
      }
      /* Touch screens can't hover, so they always get the full description. */
      @media not all and (hover: hover) and (pointer: fine) {
        .morph {
          height: var(--h-full, auto);
          transition: none;
        }
        .morph-tok {
          transform: translate(var(--bx), var(--by));
          transition: none;
        }
        .morph-short,
        .morph-text-short {
          opacity: 0;
        }
        .morph-full,
        .morph-text-full {
          opacity: 1;
        }
      }
      /* Reduced motion: no sliding, words simply cross-fade into place. */
      @media (prefers-reduced-motion: reduce) {
        .morph,
        .morph-tok {
          transition-property: opacity;
        }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
